[workspace]
name = "cog-neighbourhood-vote"
version = "0.1.0"
description = "Predict smORF COG functional categories from neighbourhood voting"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.9"
polars = ">=1.44.2,<2"
numpy = ">=2.5.3,<3"
python-annoy = ">=1.17.3,<2"
matplotlib-base = ">=3.9"
zstd = ">=1.5"

[tasks]
sweep = "python sweep_db.py"

[target.linux-64.dependencies]
voyager = ">=2.1"

[target.osx-64.dependencies]
voyager = ">=2.1"

[target.win-64.dependencies]
voyager = ">=2.1"
